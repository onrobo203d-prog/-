<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リスナー抽選ランキング</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>body{font-family:sans-serif;background:#f4f6f9;padding:12px;max-width:900px;margin:auto}h1{text-align:center}.section{background:#fff;padding:16px;border-radius:12px;margin:12px 0}input,select,button{font-size:16px;padding:12px;border-radius:8px;box-sizing:border-box;width:100%;margin:4px 0}button{border:none;color:#fff;background:#2196f3}.green{background:#4caf50}.red{background:#f44336}.result{text-align:center;font-size:2rem;font-weight:bold;min-height:70px}.listener{padding:12px;border-radius:10px;margin:8px 0;background:#fafafa}.rank1{background:#fff4c2}.rank2{background:#eee}.rank3{background:#ffe6cf}</style></head><body><h1>🎲 リスナー抽選ランキング</h1><div class='section'><h2>リスナー登録</h2><input id='listenerInput' placeholder='リスナー名'><button class='green' onclick='addListener()'>登録</button></div><div class='section'><h2>ポイント付与</h2><select id='plusTarget'></select><input id='pointAmount' type='number' value='1' min='1'><button class='green' onclick='givePoints()'>ポイント付与</button></div><div class='section'><h2>抽選</h2><button onclick='drawOne()'>1回抽選</button><input id='multiCount' type='number' value='5' min='1'><button onclick='drawMultiple()'>任意数抽選</button></div><div class='section'><h2>抽選結果</h2><div id='result' class='result'>待機中</div></div><div class='section'><h2>ランキング</h2><button onclick='downloadRanking()'>ランキングを画像保存</button><div id='rankingArea'><div id='listenerList'></div></div></div><div class='section'><button class='red' onclick='resetAll()'>全リセット</button></div><script>let listeners=JSON.parse(localStorage.getItem('listeners')||'[]');function save(){localStorage.setItem('listeners',JSON.stringify(listeners));}document.addEventListener('DOMContentLoaded',()=>{listenerInput.addEventListener('keydown',e=>{if(e.key==='Enter')addListener()});render();});function addListener(){const n=listenerInput.value.trim();if(!n)return;if(listeners.some(x=>x.name===n))return;listeners.push({name:n,plus:0,minus:0});listenerInput.value='';save();render();}function givePoints(){const idx=Number(plusTarget.value);const amt=Math.max(1,parseInt(pointAmount.value)||1);listeners[idx].plus+=amt;save();render();}function sorted(){return [...listeners].sort((a,b)=>(b.plus-b.minus)-(a.plus-a.minus)||b.plus-a.plus);}function render(){listenerList.innerHTML='';plusTarget.innerHTML='';listeners.forEach((l,i)=>plusTarget.innerHTML+=`<option value="${i}">${l.name}</option>`);sorted().forEach((l,r)=>{const idx=listeners.indexOf(l);const total=l.plus-l.minus;const medal=r===0?'🥇':r===1?'🥈':r===2?'🥉':(r+1)+'位';listenerList.innerHTML+=`<div class="listener rank${r+1}"><b>${medal} ${l.name}</b><br>＋${l.plus} ／ －${l.minus} ／ 合計 ${total}<br><button onclick="listeners[${idx}].minus++;save();render()">－1</button><button class="red" onclick="if(confirm('削除しますか？')){listeners.splice(${idx},1);save();render();}">削除</button></div>`})}function drawOne(){if(!listeners.length)return;const w=listeners[Math.floor(Math.random()*listeners.length)];w.minus++;save();render();result.innerHTML='🏆 '+w.name;}function drawMultiple(){const c=parseInt(multiCount.value)||1;if(!listeners.length)return;const out={};for(let i=0;i<c;i++){const w=listeners[Math.floor(Math.random()*listeners.length)];w.minus++;out[w.name]=(out[w.name]||0)+1;}save();render();result.innerHTML='🎉 '+c+'回抽選<br>'+Object.entries(out).sort((a,b)=>b[1]-a[1]).map(v=>v[0]+' × '+v[1]).join('<br>');}function resetAll(){if(!confirm('全データを削除しますか？'))return;listeners=[];save();result.innerHTML='待機中';render();}function downloadRanking(){html2canvas(document.getElementById('rankingArea')).then(canvas=>{const a=document.createElement('a');a.download='ranking.png';a.href=canvas.toDataURL('image/png');a.click();});}</script></body></html>
