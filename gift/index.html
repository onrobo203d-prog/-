<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRIAMギフトカウント管理ツール | おんろぼの物置き</title>
<style>
:root{--card-size:clamp(105px,18vw,150px);--blue:#62bdf2;--ink:#252525}
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:12px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #00000012}
h1{font-size:18px;margin:0 0 10px}.help{font-size:12px;color:#666;line-height:1.5;margin-bottom:10px}
.toolbar,.searchrow,.filterrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.toolbar button,.toolbar select,.searchrow input,.filterrow input{font:inherit;padding:9px 11px;border:1px solid #ccc;border-radius:8px;background:#fff;min-width:0}
button{cursor:pointer}.primary{background:var(--blue)!important;color:#fff;border:0!important;font-weight:bold}.danger{background:#ef5555!important;color:#fff;border:0!important}.subtle{background:#eee;border:0!important}.toolbar button{flex:1}.searchrow input{flex:1}.filterrow input{flex:1;width:90px}
#tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;white-space:nowrap}#tabs button{border:0;border-radius:18px;background:#e3e5e8;padding:8px 13px;font-size:13px}#tabs button.active{background:#252525;color:#fff}#tabs button.custom{background:#d9efff}#tabs button.custom.active{background:#176b9e;color:#fff}
#status{padding:0 12px 8px;font-size:13px;color:#555;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#grid{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-size),1fr));gap:10px}
.card{position:relative;background:#fff;border-radius:10px;padding:7px;text-align:center;cursor:pointer;box-shadow:0 1px 4px #0000000d;min-width:0}.card.selected{outline:3px solid #39a9ed;background:#eef8ff}.thumbwrap{position:relative;width:100%;aspect-ratio:1/1}.thumb{width:100%;height:100%;object-fit:contain;border-radius:7px}.count{position:absolute;top:3px;right:5px;color:#f00000;font-size:clamp(20px,3vw,30px);font-weight:900;line-height:1;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;pointer-events:none}.card.done .thumbwrap:after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 47%,#d00000 48%,#d00000 52%,transparent 53%);pointer-events:none;border-radius:8px}.name{font-size:12px;margin-top:4px;overflow-wrap:anywhere}.point{font-size:11px;color:#777}.goalrow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:5px;font-size:11px;color:#555}.goalrow input{width:58px;padding:4px;border:1px solid #ccc;border-radius:5px;text-align:center;font-size:12px}
#empty{padding:40px 15px;text-align:center;color:#777;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.dialog{background:#fff;border-radius:14px;padding:20px;width:min(420px,100%);max-height:90vh;overflow:auto}.dialog h2{font-size:18px;margin:0 0 10px}.dialog p{font-size:13px;color:#555;line-height:1.6}.dialog input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font:inherit}.dialog .actions{display:flex;gap:8px;margin-top:14px}.dialog .actions button{flex:1;padding:10px;border:0;border-radius:8px;font:inherit}
#previewInner{position:relative;background:#fff;padding:10px;max-width:96vw;max-height:95vh;text-align:center}#previewImg{max-width:92vw;max-height:82vh;display:block}#pageInfo{font-size:12px;margin-bottom:6px}#closePreview{position:absolute;right:4px;top:4px;border:0;background:#fff;font-size:24px;z-index:2}#prevImg,#nextImg{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:44px;height:44px;background:#222b;color:#fff;font-size:22px;z-index:2}#prevImg{left:8px}#nextImg{right:8px}
#fileInput{display:none}.smallnote{font-size:11px;color:#777}
@media(max-width:520px){:root{--card-size:calc((100vw - 38px)/3)}header{padding:10px}.toolbar button{font-size:12px;padding:8px 5px}#grid{gap:7px;padding:7px}.card{padding:5px}.goalrow input{width:48px}}
</style>
</head>
<body>
<header>
<h1>IRIAM ギフトカウント管理ツール</h1>
<div class="help">ギフト画像をタップするとカウントが1増えます。目標数に達すると斜線が表示されます。目標数を0にするとカウントのみになります。</div>
<div class="toolbar">
<button id="selectModeBtn" class="subtle">ギフト選択モード</button>
<button id="createCategoryBtn" class="primary" disabled>選択したギフトでカテゴリ作成</button>
<select id="pageCount" aria-label="画像のページ数"><option value="1">1枚</option><option value="2">2枚</option><option value="3">3枚</option><option value="4">4枚</option></select><button id="exportBtn" class="primary">画像出力</button>
<button id="resetBtn" class="danger">カウントリセット</button>
</div>
<div class="toolbar">
<button id="saveCustomBtn" class="subtle">カスタム保存</button>
<button id="addCustomBtn" class="subtle">JSON追加読み込み</button>
<button id="replaceCustomBtn" class="subtle">JSON置き換え読み込み</button>
</div>
<div class="searchrow"><input id="search" placeholder="ギフト名で検索"></div>
<div class="filterrow"><input id="minPoint" type="number" min="0" placeholder="最低pt"><input id="maxPoint" type="number" min="0" placeholder="最高pt"></div>
<input id="fileInput" type="file" accept=".json,application/json">
</header>
<nav id="tabs">
<button class="active" data-tab="全て">全て</button><button data-tab="おもちゃ">おもちゃ</button><button data-tab="ネタ">ネタ</button><button data-tab="笑">笑</button><button data-tab="定番">定番</button><button data-tab="えらい">えらい</button><button data-tab="挨拶">挨拶</button><button data-tab="ステージ">ステージ</button><button data-tab="LOVE">LOVE</button>
</nav>
<div id="status"><span id="statusText">ギフトデータを読み込み中...</span><span id="selectionText"></span></div>
<main id="grid"></main>
<div id="startupModal" class="overlay"><div class="dialog"><h2>前回のカウントデータ</h2><p>前回のカウントデータが保存されています。続きから再開するか、新しく始めるか選んでください。</p><div class="actions"><button id="restoreBtn" class="primary">前回の状態を復旧</button><button id="freshBtn" class="danger">新しく開始</button></div></div></div>
<div id="nameModal" class="overlay"><div class="dialog"><h2>カスタムカテゴリ作成</h2><p>選択したギフトを登録するカテゴリ名を入力してください。</p><input id="categoryName" type="text" maxlength="40" placeholder="例：誕生日耐久"><div class="actions"><button id="cancelName" class="subtle">キャンセル</button><button id="confirmName" class="primary">作成する</button></div></div></div>
<div id="preview" class="overlay"><div id="previewInner"><button id="closePreview">×</button><button id="prevImg">◀</button><button id="nextImg">▶</button><div id="pageInfo"></div><img id="previewImg"></div></div>
<script>
const DATA_URL='https://raw.githubusercontent.com/onrobo203d-prog/gifts-image/main/data.json';
const IMG_BASE='https://raw.githubusercontent.com/onrobo203d-prog/gifts-image/main/images/';
const STATE_KEY='onrobo_gift_counter_state_v1';
let items=[],activeTab='全て',customCategories=[],counts={},goals={},selectedIds=new Set(),selectionMode=false,previewImages=[],previewIndex=0,importMode='add';
const $=id=>document.getElementById(id);
function normalize(s){return String(s??'').normalize('NFKC').replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase()}
function getItem(id){return items.find(x=>String(x.id)===String(id))}
function isDone(item){const goal=Number(goals[item.id])||0;return goal>0&&(Number(counts[item.id])||0)>=goal}
function saveProgress(){localStorage.setItem(STATE_KEY,JSON.stringify({updated:Date.now(),counts,goals}))}
function renderTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.remove());const tabs=[['全て','全て'],['おもちゃ','おもちゃ'],['ネタ','ネタ'],['笑','笑'],['定番','定番'],['えらい','えらい'],['挨拶','挨拶'],['ステージ','ステージ'],['LOVE','LOVE']];const nav=$('tabs');tabs.forEach(([label,key])=>addTab(nav,label,key,false));customCategories.forEach((cat,i)=>addTab(nav,cat.name,'custom:'+i,true));setActiveTab()}
function addTab(nav,label,key,isCustom){const b=document.createElement('button');b.textContent=label;b.dataset.tab=key;if(isCustom)b.classList.add('custom');b.onclick=()=>{activeTab=key;setActiveTab();render()};nav.appendChild(b)}
function setActiveTab(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
function getFiltered(){const keyword=normalize($('search').value),min=$('minPoint').value===''?0:Number($('minPoint').value),max=$('maxPoint').value===''?Infinity:Number($('maxPoint').value);let list=items.filter(i=>normalize(i.name).includes(keyword));if(activeTab.startsWith('custom:')){const cat=customCategories[Number(activeTab.split(':')[1])];const ids=new Set(cat?.giftIds||[]);list=list.filter(i=>ids.has(String(i.id)))}else if(activeTab!=='全て'){list=list.filter(i=>(i.categories||[]).includes(activeTab))}return list.filter(i=>{const p=Number(i.points)||0;return p>=min&&p<=max}).sort((a,b)=>(Number(a.points)||0)-(Number(b.points)||0))}
function imageUrl(id,ext){return IMG_BASE+id+ext}
function createImg(id){const img=document.createElement('img');img.className='thumb';img.loading='lazy';img.src=imageUrl(id,'.PNG');img.onerror=()=>{img.onerror=null;img.src=imageUrl(id,'.png')};return img}
function render(){const grid=$('grid');grid.innerHTML='';const list=getFiltered();if(!list.length){const e=document.createElement('div');e.id='empty';e.textContent='表示できるギフトがありません';grid.appendChild(e)}list.forEach(item=>{const id=String(item.id),card=document.createElement('div');card.className='card';if(isDone(item))card.classList.add('done');if(selectedIds.has(id))card.classList.add('selected');const wrap=document.createElement('div');wrap.className='thumbwrap';wrap.append(createImg(item.id));const count=document.createElement('div');count.className='count';count.textContent=String(counts[id]||0);wrap.appendChild(count);const name=document.createElement('div');name.className='name';name.textContent=item.name;const point=document.createElement('div');point.className='point';point.textContent=(item.points??'')+'pt';const goalrow=document.createElement('div');goalrow.className='goalrow';goalrow.innerHTML='<span>目標</span>';const goal=document.createElement('input');goal.type='number';goal.min='0';goal.max='999999';goal.value=goals[id]??0;goal.title='0でカウントのみ';goal.onclick=e=>e.stopPropagation();goal.onchange=e=>{goals[id]=Math.max(0,Number(e.target.value)||0);saveProgress();render()};goalrow.append(goal,document.createTextNode('回'));card.append(wrap,name,point,goalrow);card.onclick=()=>{if(selectionMode){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);updateSelectionUI();render()}else{counts[id]=(Number(counts[id])||0)+1;saveProgress();render()}};grid.appendChild(card)});const total=Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0);$('statusText').textContent=`表示 ${list.length} 件 ／ 合計カウント ${total} 回`;updateSelectionUI()}
function updateSelectionUI(){$('selectModeBtn').textContent=selectionMode?'選択モードを終了':'ギフト選択モード';$('selectModeBtn').classList.toggle('primary',selectionMode);$('createCategoryBtn').disabled=!selectionMode||selectedIds.size===0;$('selectionText').textContent=selectionMode?`選択中：${selectedIds.size} 件`:''}
$('selectModeBtn').onclick=()=>{selectionMode=!selectionMode;selectedIds.clear();updateSelectionUI();render()};$('createCategoryBtn').onclick=()=>{if(!selectedIds.size)return;$('categoryName').value='';$('nameModal').style.display='flex';$('categoryName').focus()};$('cancelName').onclick=()=>$('nameModal').style.display='none';$('confirmName').onclick=()=>{const name=$('categoryName').value.trim();if(!name){alert('カテゴリ名を入力してください');return}customCategories.push({name,giftIds:[...selectedIds]});activeTab='custom:'+(customCategories.length-1);selectionMode=false;selectedIds.clear();$('nameModal').style.display='none';renderTabs();render()};
$('search').oninput=render;$('minPoint').oninput=render;$('maxPoint').oninput=render;
$('resetBtn').onclick=()=>{if(!confirm('カウント数と目標数をすべてリセットしますか？'))return;counts={};goals={};saveProgress();render()};
function downloadJSON(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
$('saveCustomBtn').onclick=()=>{if(!customCategories.length){alert('保存するカスタムカテゴリがありません');return}downloadJSON({format:'onrobo-gift-custom-v1',categories:customCategories},'カスタムカテゴリ.json')};
function chooseImport(mode){importMode=mode;$('fileInput').value='';$('fileInput').click()}$('addCustomBtn').onclick=()=>chooseImport('add');$('replaceCustomBtn').onclick=()=>chooseImport('replace');
$('fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const incoming=Array.isArray(data)?data:data.categories;if(!Array.isArray(incoming))throw new Error('categoriesがありません');const valid=incoming.map(c=>({name:String(c.name||'').trim(),giftIds:[...new Set((c.giftIds||[]).map(String).filter(id=>getItem(id)))]})).filter(c=>c.name&&c.giftIds.length);if(!valid.length)throw new Error('読み込めるカテゴリがありません');if(importMode==='replace'){if(!confirm('現在のカスタムカテゴリを置き換えます。よろしいですか？'))return;customCategories=valid}else{const existing=new Set(customCategories.map(c=>c.name));const duplicates=valid.filter(c=>existing.has(c.name));if(duplicates.length&&!confirm('同じ名前のカテゴリがあります。追加してよろしいですか？'))return;customCategories.push(...valid)}activeTab='全て';renderTabs();render();alert(`${valid.length} 件のカスタムカテゴリを読み込みました`)}catch(err){alert('JSONを読み込めませんでした。保存したカスタムカテゴリのJSONか確認してください。\n'+err.message)}};
function loadImage(id){return new Promise(resolve=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>{const fallback=new Image();fallback.crossOrigin='anonymous';fallback.onload=()=>resolve(fallback);fallback.onerror=()=>resolve(null);fallback.src=imageUrl(id,'.png')};img.src=imageUrl(id,'.PNG')})}
async function makeCanvas(list){const W=1920,H=1080,pad=28,gap=16,n=list.length;let best={size:0,score:-1};for(let cols=1;cols<=Math.min(n,100);cols++){const rows=Math.ceil(n/cols),size=Math.floor(Math.min((W-2*pad-gap*(cols-1))/cols,(H-2*pad-gap*(rows-1))/rows));const fill=(n-(rows-1)*cols)/cols,score=size*100+fill*20;if(size>0&&score>best.score)best={size,score,cols,rows}}const {size,cols,rows}=best;const gw=cols*size+(cols-1)*gap,gh=rows*size+(rows-1)*gap,sx=Math.max(pad,(W-gw)/2),sy=Math.max(pad,(H-gh)/2);const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-Math.PI/6);ctx.fillStyle='#ededed';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';for(let y=-900;y<=900;y+=105)for(let x=-1400;x<=1400;x+=260)ctx.fillText('おんろぼの物置き',x,y);ctx.restore();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const imgs=await Promise.all(list.map(i=>loadImage(i.id)));list.forEach((item,i)=>{const x=sx+(i%cols)*(size+gap),y=sy+Math.floor(i/cols)*(size+gap),img=imgs[i];if(img){const r=Math.min(size/img.width,size/img.height),w=img.width*r,h=img.height*r;ctx.drawImage(img,x+(size-w)/2,y+(size-h)/2,w,h)}else{ctx.fillStyle='#ddd';ctx.fillRect(x,y,size,size)}const count=Number(counts[String(item.id)])||0;ctx.save();ctx.textAlign='right';ctx.textBaseline='top';ctx.font=`900 ${Math.max(28,Math.floor(size*.22))}px sans-serif`;ctx.lineWidth=Math.max(4,size*.025);ctx.strokeStyle='#fff';ctx.strokeText(String(count),x+size-5,y+5);ctx.fillStyle='#f00000';ctx.fillText(String(count),x+size-5,y+5);ctx.restore();if(isDone(item)){ctx.strokeStyle='#d00000';ctx.lineWidth=Math.max(5,size*.04);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+size,y+size);ctx.stroke()}});return canvas.toDataURL('image/jpeg',.92)}
$('exportBtn').onclick=async()=>{const list=getFiltered();if(!list.length){alert('画像出力するギフトがありません');return}const pages=Math.min(Math.max(1,Number($('pageCount').value)||1),list.length);const perPage=Math.ceil(list.length/pages);previewImages=[];try{for(let i=0;i<list.length;i+=perPage)previewImages.push(await makeCanvas(list.slice(i,i+perPage)));previewIndex=0;showPreview()}catch(e){console.error(e);alert('画像を生成できませんでした。ギフト画像の読み込み状態を確認してください。')}};
function showPreview(){$('previewImg').src=previewImages[previewIndex];$('pageInfo').textContent=`${previewIndex+1} / ${previewImages.length}`;$('prevImg').style.display=previewIndex===0?'none':'block';$('nextImg').style.display=previewIndex===previewImages.length-1?'none':'block';$('preview').style.display='flex'}$('prevImg').onclick=()=>{if(previewIndex>0){previewIndex--;showPreview()}};$('nextImg').onclick=()=>{if(previewIndex<previewImages.length-1){previewIndex++;showPreview()}};$('closePreview').onclick=()=>$('preview').style.display='none';$('preview').onclick=e=>{if(e.target.id==='preview')$('preview').style.display='none'};
function startFresh(){counts={};goals={};saveProgress();$('startupModal').style.display='none';render()}function restore(){try{const d=JSON.parse(localStorage.getItem(STATE_KEY)||'{}');counts=d.counts||{};goals=d.goals||{}}catch(e){counts={};goals={}}$('startupModal').style.display='none';render()} 
async function init(){try{const r=await fetch(DATA_URL);if(!r.ok)throw new Error('ギフトデータを取得できません');items=await r.json();renderTabs();const saved=localStorage.getItem(STATE_KEY);if(saved){$('startupModal').style.display='flex'}else{render()}}catch(e){$('statusText').textContent='ギフトデータを読み込めませんでした。ネット接続を確認してください。';$('grid').innerHTML='<div id="empty">ギフトデータの読み込みに失敗しました。</div>';console.error(e)}}$('restoreBtn').onclick=restore;$('freshBtn').onclick=startFresh;init();
</script>
</body>
</html>
