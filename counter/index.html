<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リスナー抽選カウンター</title>

<style>
body{
    font-family:sans-serif;
    max-width:1000px;
    margin:20px auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.section{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,button{
    padding:8px;
    font-size:16px;
}

button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    margin:2px;
}

.add-btn{
    background:#4caf50;
    color:white;
}

.draw-btn{
    background:#2196f3;
    color:white;
}

.reset-btn{
    background:#f44336;
    color:white;
}

.listener{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}

.listener-name{
    font-weight:bold;
    min-width:150px;
}

.counter-group{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

.plus{
    color:#0a8f00;
    font-weight:bold;
}

.minus{
    color:#d60000;
    font-weight:bold;
}

.total{
    color:#333;
    font-weight:bold;
}

.result{
    font-size:20px;
    font-weight:bold;
    text-align:center;
    margin-top:10px;
}

.history{
    max-height:250px;
    overflow-y:auto;
    padding:10px;
    background:#fafafa;
    border-radius:8px;
}

.small-btn{
    padding:5px 10px;
}
</style>
</head>
<body>

<h1>🎲 リスナー抽選カウンター</h1>

<div class="section">

<h2>リスナー登録</h2>

<input id="listenerName" placeholder="リスナー名">

<button class="add-btn" onclick="addListener()">
登録
</button>

</div>

<div class="section">

<h2>抽選</h2>

<button class="draw-btn" onclick="drawOne()">
1回抽選
</button>

<input
type="number"
id="drawCount"
value="5"
min="1"
style="width:80px;"
>

<button class="draw-btn" onclick="drawMultiple()">
任意数抽選
</button>

<div class="result" id="result">
抽選待機中
</div>

</div>

<div class="section
