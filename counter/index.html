<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>嫁こな王、ちょっと待った抽選</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#f4f6f9;
    font-family:"Yu Gothic",sans-serif;
    color:#333;
}

.container{
    width:100%;
    max-width:750px;
    margin:auto;
}

h1{
    font-size:1.8rem;
    text-align:center;
    margin-bottom:16px;
}

h2{
    margin-top:0;
    font-size:1.2rem;
}

.section{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:14px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:6px;
}

.green{
    background:#4caf50;
    color:white;
}

.blue{
    background:#2196f3;
    color:white;
}

.red{
    background:#f44336;
    color:white;
}

.small{
    width:auto;
    padding:10px 14px;
    margin:2px;
}

.result{
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.draw-area{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.draw-count{
    width:100%;
}

.listener{
    display:block;
    padding:14px;
    border-radius:14px;
    margin-bottom:10px;
}

.listener-header{
    font-size:1.1rem;
    font-weight:bold;
    margin-bottom:10px;
}

.listener-stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-weight:bold;
}

.listener-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.rank1{
    background:#fff4c2;
    border:2px solid #ffcf33;
}

.rank2{
    background:#efefef;
    border:2px solid #c8c8c8;
}

.rank3{
    background:#ffe6cf;
    border:2px solid #d28a52;
}

.plus{
    color:#1f9b41;
}

.minus{
    color:#d52b2b;
}

.total{
    font-size:1.1rem;
}

.history{
    max-height:250px;
    overflow-y:auto;
    font-size:14px;
}

.history div{
    padding:6px 0;
    border-bottom:1px solid #eee;
}

@media (min-width:768px){

    .draw-area{
        flex-direction:row;
        align-items:center;
    }

    .draw-count{
        width:120px;
    }

    button{
        width:auto;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>嫁こな王、ちょっと待った抽選</h1>

<!-- 登録 -->
<div class="section">

<h2>リスナー登録</h2>

<input
id="listenerInput"
placeholder="リスナー名"
>

<button
class="green"
onclick="addListener()">
登録
</button>

</div>

<!-- 抽選 -->

<div class="section">

<h2>抽選</h2>

<button
id="drawBtn"
class="blue"
onclick="drawOne()">
1回抽選
</button>

<input
id="multiCount"
type="number"
value="5"
min="1"
style="width:80px;"
>

<button
id="multiBtn"
class="blue"
onclick="drawMultiple()">
任意数抽選
</button>

</div>

<!-- 結果 -->

<div class="section">

<h2>抽選結果</h2>

<div
id="result"
class="result">
待機中
</div>

</div>

<!-- ランキング -->

<div class="section">

<h2>ランキング</h2>

<div id="listenerList"></div>

</div>

<!-- 履歴 -->

<div class="section">

<h2>抽選履歴</h2>

<div
class="history"
id="history">
</div>

</div>

<!-- リセット -->

<div class="section">

<button
class="red"
onclick="resetAll()">
すべてリセット
</button>

</div>

</div>

<script>

let listeners =
JSON.parse(
localStorage.getItem("listeners")
) || [];

let historyData =
JSON.parse(
localStorage.getItem("historyData")
) || [];

function saveData(){

    localStorage.setItem(
        "listeners",
        JSON.stringify(listeners)
    );

    localStorage.setItem(
        "historyData",
        JSON.stringify(historyData)
    );
}

document
.getElementById("listenerInput")
.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){
        addListener();
    }

});

function addListener(){

    const input =
    document.getElementById("listenerInput");

    const name =
    input.value.trim();

    if(!name) return;

    if(
        listeners.some(
            l=>l.name===name
        )
    ){
        alert("既に登録されています");
        return;
    }

    listeners.push({
        name,
        plus:0,
        minus:0
    });

    input.value="";

    saveData();
    render();
}

function addPlus(index){

    listeners[index].plus++;

    saveData();
    render();
}

function addMinus(index){

    listeners[index].minus++;

    saveData();
    render();
}

function deleteListener(index){

    if(!confirm("削除しますか？"))
    return;

    listeners.splice(index,1);

    saveData();
    render();
}

function addHistory(text){

    const time =
    new Date().toLocaleTimeString();

    historyData.unshift(
        `[${time}] ${text}`
    );

    saveData();

    renderHistory();
}

function renderHistory(){

    const area =
    document.getElementById("history");

    area.innerHTML="";

    historyData.forEach(item=>{

        const div =
        document.createElement("div");

        div.textContent=item;

        area.appendChild(div);

    });
}

function getSortedListeners(){

    return [...listeners].sort((a,b)=>{

        const totalA =
        a.plus-a.minus;

        const totalB =
        b.plus-b.minus;

        if(totalB!==totalA){

            return totalB-totalA;
        }

        return b.plus-a.plus;
    });

}

function render(){

    const list =
    document.getElementById("listenerList");

    list.innerHTML="";

    const sorted =
    getSortedListeners();

    sorted.forEach((listener,rank)=>{

        const originalIndex =
        listeners.indexOf(listener);

        const total =
        listener.plus-listener.minus;

        let medal =
        `${rank+1}位`;

        let rankClass = "";

        if(rank===0){
            medal="🥇";
            rankClass="rank1";
        }

        if(rank===1){
            medal="🥈";
            rankClass="rank2";
        }

        if(rank===2){
            medal="🥉";
            rankClass="rank3";
        }

        const div =
        document.createElement("div");

        div.className=
        `listener ${rankClass}`;

        div.innerHTML=`

        <div>

        <strong>
        ${medal}
        ${listener.name}
        </strong>

        </div>

        <div class="counter">

            <span class="plus">
            + ${listener.plus}
            </span>

            <button
            class="small"
            onclick="addPlus(${originalIndex})">
            ＋1
            </button>

            <span class="minus">
            - ${listener.minus}
            </span>

            <button
            class="small"
            onclick="addMinus(${originalIndex})">
            －1
            </button>

            <span class="total">
            合計 ${total}
            </span>

            <button
            class="red small"
            onclick="deleteListener(${originalIndex})">
            削除
            </button>

        </div>
        `;

        list.appendChild(div);

    });

}

async function roulette(){

    return new Promise(resolve=>{

        const result =
        document.getElementById("result");

        let count=0;

        const interval =
        setInterval(()=>{

            const random =
            listeners[
                Math.floor(
                    Math.random()
                    * listeners.length
                )
            ];

            result.textContent =
            `🎲 ${random.name}`;

            count++;

        },80);

        setTimeout(()=>{

            clearInterval(interval);

            const winner =
            listeners[
                Math.floor(
                    Math.random()
                    * listeners.length
                )
            ];

            resolve(winner);

        },2000);

    });

}

async function drawOne(){

    if(listeners.length===0){

        alert("リスナーを登録してください");
        return;
    }

    disableButtons(true);

    const winner =
    await roulette();

    winner.minus++;

    document.getElementById(
        "result"
    ).innerHTML =
    `🎉 ${winner.name}`;

    addHistory(
        `${winner.name} が当選`
    );

    saveData();
    render();

    disableButtons(false);
}

async function drawMultiple(){

    if(listeners.length===0){

        alert("リスナーを登録してください");
        return;
    }

    const count =
    parseInt(
        document.getElementById("multiCount").value
    );

    disableButtons(true);

    const resultCount = {};

    for(let i=0;i<count;i++){

        const winner =
        listeners[
            Math.floor(
                Math.random()*listeners.length
            )
        ];

        winner.minus++;

        resultCount[winner.name] =
        (resultCount[winner.name]||0)+1;
    }

    let text =
    `🎉 ${count}回抽選<br><br>`;

    Object.entries(resultCount)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([name,num])=>{

        text +=
        `${name} × ${num}<br>`;
    });

    document.getElementById(
        "result"
    ).innerHTML=text;

    addHistory(
        `${count}回抽選実施`
    );

    saveData();
    render();

    disableButtons(false);
}

function disableButtons(flag){

    document.getElementById(
        "drawBtn"
    ).disabled=flag;

    document.getElementById(
        "multiBtn"
    ).disabled=flag;
}

function resetAll(){

    if(
        !confirm(
            "すべて削除しますか？"
        )
    ){
        return;
    }

    listeners=[];
    historyData=[];

    saveData();

    document.getElementById(
        "result"
    ).textContent="待機中";

    render();
    renderHistory();
}

render();
renderHistory();

</script>

</body>
</html>
